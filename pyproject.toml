[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fittrack-local"
version = "0.4.0"
description = "Local-first fitness, nutrition and training diary"
readme = "README.zh-CN.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pillow>=10.1,<13", "requests>=2.32,<3", "python-multipart>=0.0.20,<1", "pwdlib[argon2]>=0.2,<1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.6,<1", "playwright>=1.50,<2"]

[project.scripts]
fittrack = "fittrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fittrack"]
artifacts = ["src/fittrack/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
